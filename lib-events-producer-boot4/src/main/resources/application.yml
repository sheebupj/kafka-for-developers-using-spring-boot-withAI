spring:
  application:
    name: lib-events-producer-boot4
  profiles:
    active: dev
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 5
      transaction-id-prefix: lib-events-tx-
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.IntegerSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    org.springframework.kafka.transaction: DEBUG
    org.apache.kafka.clients.producer.internals.TransactionManager: DEBUG

#management:
#  endpoints:
#    web:
#      exposure:
#        include: health,info,prometheus
#  metrics:
#    export:
#      prometheus:
#        enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true               # enables /actuator/health/liveness and /actuator/health/readiness
        add-additional-paths: true  # also exposes /livez and /readyz at the root
      show-details: always
      group:
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

library:
  events:
    topic: ${LIBRARY_EVENTS_TOPIC:library-events}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    doc-expansion: none
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
