plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.3'
	//developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

def openApiPort = providers.environmentVariable('SERVER_PORT').orElse('8080').get()
def openApiBaseUrl = "http://localhost:${openApiPort}"

tasks.register('exportOpenApiJson', Exec) {
	group = 'documentation'
	description = 'Exports OpenAPI JSON from a running app to docs/api/openapi.json'
	commandLine 'curl', '-sS', "${openApiBaseUrl}/v3/api-docs", '-o', 'docs/api/openapi.json'
}

tasks.register('exportOpenApiYaml', Exec) {
	group = 'documentation'
	description = 'Exports OpenAPI YAML from a running app to docs/api/openapi.yaml'
	commandLine 'curl', '-sS', "${openApiBaseUrl}/v3/api-docs.yaml", '-o', 'docs/api/openapi.yaml'
}

tasks.register('exportOpenApiSpec') {
	group = 'documentation'
	description = 'Exports OpenAPI JSON and YAML from a running app'
	dependsOn 'exportOpenApiJson', 'exportOpenApiYaml'
}
