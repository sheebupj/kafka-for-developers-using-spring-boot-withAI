#lib-events-producer-boot4-deployment-v1.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lib-events-producer-boot4
  labels:
    app: lib-events-producer-boot4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lib-events-producer-boot4
  template:
    metadata:
      labels:
        app: lib-events-producer-boot4
    spec:
      containers:
        - name: lib-events-producer-boot4
          image: sheebupj/lib-events-producer-boot4
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka-headless:9092"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
