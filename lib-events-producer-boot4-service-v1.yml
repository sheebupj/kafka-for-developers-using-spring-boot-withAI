#lib-events-producer-boot4-service-v1.yml
apiVersion: v1
kind: Service
metadata:
  name: lib-events-producer-boot4
  namespace: default
  labels:
    app: lib-events-producer-boot4
spec:
  type: NodePort                    # exposes the service on a port on the node
  selector:
    app: lib-events-producer-boot4  # routes traffic to Pods with this label
  ports:
    - port: 8080                    # the port the Service listens on inside the cluster
      targetPort: 8080              # the port the container inside the Pod listens on
      protocol: TCP
