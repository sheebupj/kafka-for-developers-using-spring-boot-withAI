apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lib-events-producer-boot4-ingress
  namespace: default
  labels:
    app: lib-events-producer-boot4
spec:
  ingressClassName: nginx           # use the nginx Ingress Controller
  rules:
    - host: library-events-producer.local  # requests to this hostname are handled here
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lib-events-producer-boot4
                port:
                  number: 8080
